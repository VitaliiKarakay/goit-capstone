global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: scheduler-controller
    static_configs:
      - targets: ["controller:8080"]
    metrics_path: /metrics

  - job_name: scheduler-workers
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 5s