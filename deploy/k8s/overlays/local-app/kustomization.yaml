apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scheduler

resources:
  - ../../base/deployment-controller.yaml
  - ../../base/deployment-worker.yaml

images:
  - name: scheduler/controller
    newName: scheduler/controller
    newTag: local-dev
  - name: scheduler/worker
    newName: scheduler/worker
    newTag: local-dev