apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scheduler

resources:
  - ../../base/prometheus/rbac.yaml
  - ../../base/prometheus/configmap.yaml
  - ../../base/prometheus/deployment.yaml
  - ../../base/grafana/deployment.yaml

configMapGenerator:
  - name: grafana-datasources
    files:
      - prometheus.yaml=../../../../monitoring/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml=../../grafana/dashboard-provider.yaml
  - name: grafana-dashboard-scheduler
    files:
      - scheduler.json=../../../../monitoring/grafana/provisioning/dashboards/scheduler.json

generatorOptions:
  disableNameSuffixHash: true