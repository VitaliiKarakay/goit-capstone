# Demo-only credentials for local minikube. Do not commit real secrets.
# Apply with: kubectl apply -f secret.example.yaml
# or use scripts/k8s/apply-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: scheduler-secrets
  namespace: scheduler
  labels:
    app.kubernetes.io/part-of: goit-capstone
type: Opaque
stringData:
  DATABASE_URL: "postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable"
  POSTGRES_USER: "scheduler"
  POSTGRES_PASSWORD: "scheduler"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin"