apiVersion: v1
kind: Service
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: goit-capstone
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: goit-capstone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
        app.kubernetes.io/part-of: goit-capstone
    spec:
      containers:
        - name: controller
          image: scheduler/controller:unset
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: scheduler-app
            - secretRef:
                name: scheduler-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi