apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: goit-capstone
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: scheduler-controller
        static_configs:
          - targets: ["controller:8080"]
        metrics_path: /metrics

      - job_name: scheduler-workers
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - scheduler
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: scheduler
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: worker
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1:9091
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
            action: replace