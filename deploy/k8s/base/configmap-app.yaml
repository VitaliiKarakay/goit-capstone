apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-app
  labels:
    app.kubernetes.io/part-of: goit-capstone
data:
  HTTP_ADDR: "0.0.0.0:8080"
  NATS_URL: "nats://nats:4222"
  LOG_LEVEL: "info"
  SCHEDULER_INTERVAL: "1s"
  SCHEDULER_BATCH: "100"
  OUTBOX_INTERVAL: "500ms"
  OUTBOX_BATCH: "50"
  RECOVERY_INTERVAL: "5s"
  RECOVERY_BATCH: "50"
  MAX_CLAIM_ATTEMPTS: "5"
  METRICS_DB_REFRESH_INTERVAL: "10s"
  WORKER_LEASE_DURATION: "45s"
  WORKER_LEASE_RENEW_INTERVAL: "10s"
  WORKER_SEND_TIMEOUT: "90s"
  MOCK_SEND_DELAY: "0s"
  MOCK_FAILURE_RATE: "0"
  METRICS_ADDR: "0.0.0.0:9091"